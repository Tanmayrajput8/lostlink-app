name: LostLink CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check application
        run: node --check server.js

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t tanmayrajput08/lostlink-app:latest .

      - name: Push Docker image
        run: docker push tanmayrajput08/lostlink-app:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/lostlink-key.pem
          chmod 600 ~/.ssh/lostlink-key.pem

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
          ansible-galaxy collection install community.docker

      - name: Create Ansible inventory
        run: |
          mkdir -p /tmp/lostlink-ansible
          cat > /tmp/lostlink-ansible/inventory.ini <<EOF
          [lostlink]
          lostlink-server ansible_host=${{ secrets.EC2_HOST }} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/lostlink-key.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'
          EOF

      - name: Deploy with Ansible
        working-directory: lostlink-ansible
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          cp deploy.yml /tmp/lostlink-ansible/deploy.yml
          cd /tmp/lostlink-ansible

          ansible-playbook \
            -i inventory.ini \
            deploy.yml \
            -e "mongo_uri=$MONGO_URI"