<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse Items – LostLink</title>
  <meta name="description" content="Browse all approved lost and found item reports on campus. Filter by type and category." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page-wrapper">
    <!-- Navbar -->
    <nav class="navbar">
      <div class="navbar-inner">
        <a href="index.html" class="nav-logo">Lost<span>Link</span></a>
        <div id="nav-links" class="nav-links">
          <a href="items.html" class="nav-link active">Browse Items</a>
          <a href="report-lost.html" class="nav-link">Report Lost</a>
          <a href="report-found.html" class="nav-link">Report Found</a>
        </div>
        <div id="nav-right" class="nav-right">
          <a href="login.html" class="btn btn-sm btn-ghost">Login</a>
          <a href="register.html" class="btn btn-sm btn-primary">Register</a>
        </div>
      </div>
    </nav>

    <div id="toast-container" class="toast-container"></div>

    <main class="page-content" style="flex: 1;">
      <div class="page">
        <div class="container">
          <div class="page-header" style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px;">
            <div>
              <h1 class="section-title">Browse Lost &amp; Found Items</h1>
              <p class="section-subtitle">Search and filter approved item reports from campus</p>
            </div>
            <div style="display: flex; gap: 10px;">
              <a href="report-lost.html" class="btn btn-secondary">Report Lost</a>
              <a href="report-found.html" class="btn btn-primary">Report Found</a>
            </div>
          </div>

          <!-- Filters Bar -->
          <div class="filters-bar">
            <div class="search-input-wrap">
              <span class="search-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              </span>
              <input
                type="text"
                id="search-input"
                class="form-input"
                placeholder="Search by title, location, or description..."
              />
            </div>

            <div class="form-group">
              <select id="type-filter" class="form-select">
                <option value="">All Types</option>
                <option value="lost">Lost Items</option>
                <option value="found">Found Items</option>
              </select>
            </div>

            <div class="form-group">
              <select id="category-filter" class="form-select">
                <option value="">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Wallet">Wallet</option>
                <option value="Keys">Keys</option>
                <option value="Bag">Bag</option>
                <option value="Clothing">Clothing</option>
                <option value="Books">Books</option>
                <option value="Jewellery">Jewellery</option>
                <option value="ID">ID Card</option>
                <option value="Sports">Sports Equipment</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <button id="reset-filters-btn" class="btn btn-ghost">Reset</button>
          </div>

          <!-- Items Grid -->
          <div id="items-grid" class="items-grid">
            <div class="loading-center" style="grid-column: 1 / -1;">
              <div class="spinner spinner-dark spinner-lg"></div>
              <p>Loading items...</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Item Detail Modal -->
      <div id="item-modal" class="modal-overlay" style="display: none;">
        <div class="modal">
          <div class="modal-header">
            <h2 id="modal-title">Item Details</h2>
            <button class="modal-close" onclick="closeModal()">&#x2715;</button>
          </div>
          <div class="modal-body" id="modal-content">
            <!-- Populated dynamically -->
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <p>&copy; 2026 LostLink – Campus Lost &amp; Found System. All rights reserved.</p>
      </div>
    </footer>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    let allItems = [];

    async function loadItems() {
      const grid = document.getElementById("items-grid");
      grid.innerHTML = `
        <div class="loading-center" style="grid-column: 1 / -1;">
          <div class="spinner spinner-dark spinner-lg"></div>
          <p>Loading items...</p>
        </div>
      `;

      const search = document.getElementById("search-input").value.trim();
      const type = document.getElementById("type-filter").value;
      const category = document.getElementById("category-filter").value;

      let query = [];
      if (search) query.push(`search=${encodeURIComponent(search)}`);
      if (type) query.push(`type=${encodeURIComponent(type)}`);
      if (category) query.push(`category=${encodeURIComponent(category)}`);
      const qs = query.length > 0 ? `?${query.join("&")}` : "";

      try {
        const res = await fetchAPI(`/items${qs}`);
        if (!res.ok || !res.data || !Array.isArray(res.data.items)) {
          throw new Error("Unable to load items");
        }

        allItems = res.data.items;
        renderItemsGrid(allItems);
      } catch (error) {
        grid.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;"><p>Unable to load items.</p></div>`;
      }
    }

    function renderItemsGrid(items) {
      const grid = document.getElementById("items-grid");
      if (items.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <p>No approved items found.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = items.map(item => `
        <div class="card item-card">
          ${item.image
            ? `<img src="${getUploadUrl(item.image)}" alt="${escapeHtml(item.title)}" class="item-card-image" loading="lazy" onerror="this.replaceWith(createImagePlaceholder())" />`
            : `<div class="item-card-image-placeholder"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--slate-400)"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></div>`
          }
          <div class="item-card-body">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <span class="badge ${item.type === 'lost' ? 'badge-lost' : 'badge-found'}">
                ${item.type.toUpperCase()}
              </span>
              <span class="badge badge-secondary" style="font-size:11px;">${escapeHtml(item.category)}</span>
            </div>
            <h3 class="item-card-title">${escapeHtml(item.title)}</h3>
            <div class="item-card-meta">
              <span>${escapeHtml(item.location)}</span>
              <span>${escapeHtml(item.date)}</span>
            </div>
            <p style="font-size: 13px; color: var(--slate-600); margin-bottom: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 38px;">
              ${escapeHtml(item.description)}
            </p>
            <div class="item-card-footer">
              <span style="font-size: 12px; color: var(--text-muted);">
                By ${escapeHtml(item.reporterName || 'Campus Member')}
              </span>
              <button class="btn btn-sm btn-primary" onclick="openDetailModal('${item._id}')">View Details</button>
            </div>
          </div>
        </div>
      `).join("");
    }

    function createImagePlaceholder() {
      const placeholder = document.createElement("div");
      placeholder.className = "item-card-image-placeholder";
      placeholder.textContent = "Image unavailable";
      return placeholder;
    }

    async function openDetailModal(id) {
      const modal = document.getElementById("item-modal");
      const content = document.getElementById("modal-content");
      const title = document.getElementById("modal-title");

      content.innerHTML = `<div class="loading-center"><div class="spinner spinner-dark"></div><p>Loading item...</p></div>`;
      modal.style.display = "flex";

      const res = await fetchAPI(`/items/${id}`);
      if (!res.ok || !res.data || !res.data.item) {
        const message = res.data?.message || `Request failed with status ${res.status || "unknown"}.`;
        console.error("Unable to load item details", { id, status: res.status, message });
        content.innerHTML = `<div class="alert alert-error">${escapeHtml(message)}</div>`;
        return;
      }

      const item = res.data.item;
      title.textContent = item.title;

      const user = getUser();
      const currentUserId = user?._id || user?.id;
      const reporterId = item.reporterID?._id || item.reporterID;
      const isOwner = user && reporterId && currentUserId && String(currentUserId) === String(reporterId);
      const userIsAdmin = isAdmin();

      // ── Determine the correct action button ────────────────────────────
      let actionBtn = "";

      if (item.status === "returned") {
        // Item already returned — no actions available
        actionBtn = `<span class="badge badge-secondary" style="padding: 8px 14px; font-size: 13px;">This item has been returned</span>`;

      } else if (item.type === "lost") {
        // ── LOST ITEM: action is "I Found This Item" ──
        if (!user) {
          actionBtn = `<a href="login.html" class="btn btn-primary">Login to Report Found</a>`;
        } else if (isOwner) {
          actionBtn = `<span class="badge badge-secondary" style="padding: 8px 14px; font-size: 13px;">This is your lost item report</span>`;
        } else if (userIsAdmin) {
          actionBtn = `<span class="badge badge-secondary" style="padding: 8px 14px; font-size: 13px;">Admin View</span>`;
        } else {
          actionBtn = `<a href="report-found.html?linkedLostItem=${item._id}" class="btn btn-primary">I Found This Item</a>`;
        }

      } else {
        // ── FOUND ITEM: action is "Claim This Item" ──
        if (!user) {
          actionBtn = `<a href="login.html" class="btn btn-primary">Login to Claim This Item</a>`;
        } else if (isOwner) {
          actionBtn = `<span class="badge badge-secondary" style="padding: 8px 14px; font-size: 13px;">You reported this found item</span>`;
        } else if (userIsAdmin) {
          actionBtn = `<span class="badge badge-secondary" style="padding: 8px 14px; font-size: 13px;">Admin View</span>`;
        } else {
          // Check if user already has a claim for this item
          let userHasClaimed = false;
          try {
            const claimRes = await fetchAPI("/claims/mine");
            if (claimRes.ok && claimRes.data && Array.isArray(claimRes.data.claims)) {
              userHasClaimed = claimRes.data.claims.some(c => {
                const cItemId = c.itemId?._id || c.itemId;
                return String(cItemId) === String(item._id) && ["pending", "approved"].includes(c.status);
              });
            }
          } catch (e) {}

          if (userHasClaimed) {
            actionBtn = `<span class="badge badge-secondary" style="padding: 8px 14px; font-size: 13px;">You have already submitted a claim</span>`;
          } else {
            actionBtn = `<a href="claim.html?id=${item._id}" class="btn btn-primary">Claim This Item</a>`;
          }
        }
      }

      // ── Potential Matches Section ───────────────────────────────────────
      let matchesHtml = `<div style="font-size: 13px; color: var(--text-muted);">Searching for potential matches...</div>`;
      try {
        const matchRes = await fetchAPI(`/items/${item._id}/matches`);
        if (matchRes.ok && matchRes.data && Array.isArray(matchRes.data.matches) && matchRes.data.matches.length > 0) {
          const matchItems = matchRes.data.matches.slice(0, 4);
          matchesHtml = matchItems.map(m => `
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: white; border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px;">
              <div>
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 2px;">
                  <span class="badge badge-pending" style="font-size: 11px;">Match Score: ${m.matchScore}%</span>
                  <strong style="font-size: 13px; color: var(--slate-900);">${escapeHtml(m.item.title)}</strong>
                </div>
                <div style="font-size: 12px; color: var(--text-muted);">
                  ${escapeHtml(m.item.category)} &bull; ${escapeHtml(m.item.location)}
                </div>
              </div>
              <button class="btn btn-sm btn-ghost" style="font-size: 12px;" onclick="openDetailModal('${m.item._id}')">View</button>
            </div>
          `).join("");
        } else {
          matchesHtml = `<div style="font-size: 13px; color: var(--text-muted); padding: 10px 14px; background: var(--slate-50); border-radius: var(--radius-sm); border: 1px dashed var(--border);">No potential matches found in the catalog at this time.</div>`;
        }
      } catch (e) {
        matchesHtml = `<div style="font-size: 13px; color: var(--text-muted);">Could not load potential matches.</div>`;
      }

      const matchHeading = item.type === "lost" ? "Possible Found Matches" : "Possible Lost Matches";

      // ── Render Modal Content ──────────────────────────────────────────
      content.innerHTML = `
        ${item.image
          ? `<img src="${getUploadUrl(item.image)}" alt="${escapeHtml(item.title)}" style="width: 100%; max-height: 260px; object-fit: cover; border-radius: var(--radius-md); margin-bottom: 20px;" onerror="this.replaceWith(createDetailImagePlaceholder())" />`
          : `<div class="item-card-image-placeholder" style="margin-bottom: 20px;">Image unavailable</div>`}
        <div style="display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;">
          <span class="badge ${item.type === "lost" ? "badge-lost" : "badge-found"}">${item.type.toUpperCase()}</span>
          <span class="badge badge-secondary">${escapeHtml(item.category)}</span>
          <span class="badge ${item.status === 'approved' ? 'badge-active' : item.status === 'returned' ? 'badge-returned' : item.status === 'rejected' ? 'badge-rejected' : 'badge-pending'}">${item.status.toUpperCase()}</span>
        </div>
        <div style="background: var(--slate-50); padding: 14px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 14px; border: 1px solid var(--border);">
          <div style="margin-bottom: 6px;"><strong>Location:</strong> ${escapeHtml(item.location)}</div>
          <div style="margin-bottom: 6px;"><strong>Date:</strong> ${escapeHtml(item.date)} ${item.time ? `(${escapeHtml(item.time)})` : ""}</div>
          <div><strong>Reporter:</strong> ${escapeHtml(item.reporterName || "Campus Member")}</div>
        </div>
        <div style="margin-bottom: 20px;">
          <h4 style="font-size: 14px; font-weight: 700; margin-bottom: 6px;">Description</h4>
          <p style="font-size: 14px; color: var(--slate-700); line-height: 1.6; white-space: pre-line;">${escapeHtml(item.description)}</p>
        </div>

        <!-- Potential Matches -->
        <div style="margin-bottom: 24px; padding: 14px; background: var(--slate-50); border-radius: var(--radius-sm); border: 1px solid var(--border);">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h4 style="font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--slate-700); margin: 0;">
              ${matchHeading}
            </h4>
            <span style="font-size: 11px; color: var(--text-muted);">Rule-based similarity score</span>
          </div>
          <div>${matchesHtml}</div>
        </div>

        <!-- Action Buttons -->
        <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 16px;">
          ${actionBtn}
          <button class="btn btn-secondary" onclick="closeModal()">Close</button>
        </div>
      `;
    }

    function closeModal() {
      document.getElementById("item-modal").style.display = "none";
    }

    function createDetailImagePlaceholder() {
      const placeholder = document.createElement("div");
      placeholder.className = "item-card-image-placeholder";
      placeholder.style.marginBottom = "20px";
      placeholder.textContent = "Image unavailable";
      return placeholder;
    }

    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const directId = params.get("id");

      loadItems().then(() => {
        if (directId) openDetailModal(directId);
      });

      let searchTimeout;
      document.getElementById("search-input").addEventListener("input", () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(loadItems, 300);
      });
      document.getElementById("type-filter").addEventListener("change", loadItems);
      document.getElementById("category-filter").addEventListener("change", loadItems);
      document.getElementById("reset-filters-btn").addEventListener("click", () => {
        document.getElementById("search-input").value = "";
        document.getElementById("type-filter").value = "";
        document.getElementById("category-filter").value = "";
        loadItems();
      });

      document.getElementById("item-modal").addEventListener("click", (e) => {
        if (e.target.id === "item-modal") closeModal();
      });
    });
  </script>
</body>
</html>
