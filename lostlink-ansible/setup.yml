- name: Setup LostLink Server
  hosts: lostlink
  become: yes

  tasks:
    - name: Update packages
      apt:
        update_cache: yes

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Start Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to Docker group
      user:
        name: ubuntu
        groups: docker
        append: yes